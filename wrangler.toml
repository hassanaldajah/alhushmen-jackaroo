name = "alhushmen-jackaroo"
main = "src/worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Custom domain route is added at deploy time after the owner confirms names.
routes = [{ pattern = "alhushmen.al-hassan.dev", custom_domain = true, zone_name = "al-hassan.dev" }]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[observability]
enabled = false

# Secrets (set by the owner only, never in files):
#   wrangler secret put PASSPHRASE
#   wrangler secret put SESSION_SECRET
#   wrangler secret put YT_API_KEY          (optional, enables song search)
#   wrangler secret put TURN_KEY_ID         (optional, Cloudflare Realtime TURN)
#   wrangler secret put TURN_KEY_API_TOKEN  (optional)
# Non-secret vars:
[vars]
# Must equal the deployed origin exactly, or /api/auth answers 403 for every login.
ALLOWED_ORIGINS = "https://alhushmen.al-hassan.dev"
